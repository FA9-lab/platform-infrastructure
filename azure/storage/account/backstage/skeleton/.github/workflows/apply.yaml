name: Infrastructure Apply

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    uses: FA9-lab/platform-workflows/.github/workflows/terraform-apply.yml@feature/deployment-repo-plan
    with:
      deployment-name: "storage-${{ values.application }}-${{ values.environment }}-${{ values.deploymentId }}-${{ values.requestId }}"
      working-directory: "."
    secrets: inherit
