apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: azure-linux-vm
  title: Azure Linux Virtual Machine
  description: Provision a standardized Azure Linux VM through the platform

spec:
  owner: user:guest
  type: infrastructure

  parameters:
    - title: Deployment Information
      required:
        - application
        - environment
        - requestId
      properties:
        application:
          title: Application
          type: string
          description: Application or workload associated with the VM

        environment:
          title: Environment
          type: string
          enum:
            - dev
            - test
            - prod

        requestId:
          title: Request / Change ID
          type: string
          description: Enterprise request or change record for traceability

    - title: Azure Configuration
      required:
        - region
        - resourceGroup
        - subnetId
        - vmSize
      properties:
        region:
          title: Azure Region
          type: string
          enum:
            - eastus
            - westus2

        resourceGroup:
          title: Resource Group
          type: string
          default: rg-platform-lab

        subnetId:
          title: Subnet
          type: string
          description: Azure subnet resource ID

        vmSize:
          title: VM Size
          type: string
          default: Standard_B2s
          enum:
            - Standard_B2s
            - Standard_D2s_v5

    - title: Administrative Access
      required:
        - adminSshPublicKey
      properties:
        adminSshPublicKey:
          title: SSH Public Key
          type: string
          description: Public SSH key used for VM administrative access
  steps:
    - id: generate
      name: Generate Azure VM Deployment
      action: fetch:template
      input:
        url: ./skeleton
        values:
          deploymentId: a7k29q # LAB ONLY - replace with generated ID
          application: ${{ parameters.application }}
          environment: ${{ parameters.environment }}
          requestId: ${{ parameters.requestId }}
          region: ${{ parameters.region }}
          resourceGroup: ${{ parameters.resourceGroup }}
          subnetId: ${{ parameters.subnetId }}
          vmSize: ${{ parameters.vmSize }}
          adminSshPublicKey: ${{ parameters.adminSshPublicKey }}
          
    - id: publish
      name: Publish Deployment Repository
      action: publish:github
      input:
        repoUrl: github.com?owner=FA9-lab&repo=vm-${{ parameters.application }}-${{ parameters.region }}-a7k29q-${{ parameters.requestId }}
        defaultBranch: main
        description: Azure VM deployment managed by PELab IDP
        repoVisibility: public
        
  output:
    links:
      - title: Deployment Repository
        url: ${{ steps['publish'].output.remoteUrl }}
