name: Infrastructure Plan

on:
  pull_request:
    branches:
      - main
permissions:
  id-token: write
  contents: read
  
jobs:
  plan:
    uses: FA9-lab/platform-workflows/.github/workflows/terraform-plan.yml@feature/deployment-repo-plan
    with:
      deployment-name: "${{ values.application }}-${{ values.environment }}-${{ values.region }}-${{ values.deploymentId }}-${{ values.requestId }}"
      working-directory: "."
    secrets: inherit
